<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Neon Linear Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="#030712"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Status Pill -->
  <g transform="translate(80, 80)">
    <rect width="360" height="38" rx="19" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.3"/>
    <circle cx="24" cy="19" r="5" fill="#34d399"/>
    <circle cx="24" cy="19" r="9" fill="#34d399" fill-opacity="0.25"/>
    <text x="42" y="24" fill="#93c5fd" font-family="monospace, monospace" font-size="13" font-weight="600" letter-spacing="1">AVAILABLE FOR SWE &amp; AI/ML ROLES</text>
  </g>

  <!-- Title / Branding -->
  <text x="80" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    SARAN R
  </text>
  <text x="80" y="250" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">
    Artificial Intelligence &amp; Machine Learning Engineer
  </text>
  <text x="80" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Cloud Infrastructure (AWS) · Full-Stack Architect (Next.js 16) · Java Algorithmic Problem Solving
  </text>

  <!-- Architecture & Telemetry Grid (Right Side Cards) -->
  <g transform="translate(740, 90)">
    <!-- Terminal Preview Card -->
    <rect width="380" height="420" rx="20" fill="#0b0d17" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect width="380" height="42" rx="20" fill="#111827" fill-opacity="0.6"/>
    <circle cx="28" cy="21" r="5" fill="#ef4444"/>
    <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    <text x="82" y="25" fill="#64748b" font-family="monospace, monospace" font-size="12">saran.config.ts</text>
    
    <!-- Code Content -->
    <text x="28" y="75" fill="#64748b" font-family="monospace" font-size="12">// Verified Telemetry</text>
    
    <text x="28" y="115" fill="#38bdf8" font-family="monospace" font-size="13">const <tspan fill="#f1f5f9">engineer</tspan> = {</text>
    <text x="48" y="145" fill="#94a3b8" font-family="monospace" font-size="13">degree: <tspan fill="#60a5fa">"B.Tech AI &amp; ML"</tspan>,</text>
    <text x="48" y="175" fill="#94a3b8" font-family="monospace" font-size="13">college: <tspan fill="#cbd5e1">"Panimalar Engineering"</tspan>,</text>
    <text x="48" y="205" fill="#94a3b8" font-family="monospace" font-size="13">languages: <tspan fill="#fbbf24">["Java 21", "Python", "TS"]</tspan>,</text>
    <text x="48" y="235" fill="#94a3b8" font-family="monospace" font-size="13">database: <tspan fill="#34d399">"Neon PostgreSQL"</tspan>,</text>
    <text x="48" y="265" fill="#94a3b8" font-family="monospace" font-size="13">leetcode: <tspan fill="#f59e0b">"90 Solved (Java DSA)"</tspan>,</text>
    <text x="48" y="295" fill="#94a3b8" font-family="monospace" font-size="13">cloud: <tspan fill="#f97316">"AWS &amp; Vercel"</tspan></text>
    <text x="28" y="325" fill="#38bdf8" font-family="monospace" font-size="13">};</text>

    <!-- Metrics Bar -->
    <rect x="24" y="345" width="332" height="52" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="44" y="377" fill="#60a5fa" font-family="monospace" font-size="15" font-weight="700">arthaX</text>
    <text x="100" y="377" fill="#64748b" font-family="monospace" font-size="11">FinTech Terminal</text>
    <text x="250" y="377" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">● Live 60 FPS</text>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(80, 480)">
    <g transform="translate(0, 0)">
      <rect width="130" height="38" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="24" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">Next.js 16</text>
    </g>
    <g transform="translate(145, 0)">
      <rect width="130" height="38" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="24" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(290, 0)">
      <rect width="130" height="38" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="24" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">Neon Postgres</text>
    </g>
    <g transform="translate(435, 0)">
      <rect width="130" height="38" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="24" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">AWS Cloud</text>
    </g>
    <g transform="translate(580, 0)">
      <rect width="130" height="38" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="24" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">PyTorch / CV</text>
    </g>
  </g>

  <!-- Footer URL in Frame -->
  <text x="80" y="560" fill="#475569" font-family="monospace" font-size="13" letter-spacing="1">
    technosaran.vercel.app · github.com/technosaran
  </text>
</svg>
